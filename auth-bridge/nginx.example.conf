# Template: merge into your nginx http{} / server{} configuration; replace domain/certificate paths.
# Do not log query strings (OAuth codes/state) or JSON request bodies.
limit_req_zone $binary_remote_addr zone=jingliu_qr_start:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=jingliu_qr_poll:10m rate=5r/s;
log_format jingliu_auth_safe '$time_iso8601 $request_method $uri $status';
server {
    listen 443 ssl;
    server_name auth.example.com;
    ssl_certificate /YOUR_CERT/fullchain.pem;
    ssl_certificate_key /YOUR_CERT/privkey.pem;
    client_max_body_size 16k;
    client_body_timeout 10s;
    access_log /var/log/nginx/jingliu-auth-access.log jingliu_auth_safe;
    # Audit operational error logging too: don't enable debug/request-body logging in production.
    error_log /var/log/nginx/jingliu-auth-error.log crit;
    proxy_request_buffering on;
    proxy_read_timeout 50s;
    proxy_connect_timeout 5s;
    add_header Referrer-Policy no-referrer always;
    location = /api/qr/start {
        limit_req zone=jingliu_qr_start burst=3 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }
    location /api/qr/ {
        limit_req zone=jingliu_qr_poll burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }
    location /callback/ {
        limit_req zone=jingliu_qr_poll burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }
    location / { return 404; }
}
