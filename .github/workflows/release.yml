name: Release Jingliu APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jingliu-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"
  GRADLE_VERSION: "8.11.1"

jobs:
  build-and-release:
    name: Build and publish release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: true

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Configure local CI paths
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(python -c 'import sys; print(sys.executable)')"
          printf 'buildPython=%s\n' "$python_bin" > python-build.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f python-runtime-requirements.txt

      - name: Restore stable debug signing key when configured
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey >/dev/null
            echo "Stable debug keystore restored."
          else
            echo "DEBUG_KEYSTORE_BASE64 is not configured; Gradle will use a temporary debug key."
          fi

      - name: Restore release signing key when configured
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            chmod 600 "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore restored."
          else
            echo "ANDROID_KEYSTORE_BASE64 is not configured; release APK will fall back to debug signing (see build log warning)."
          fi

      - name: Show toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          python --version
          gradle --version
          echo "tag=${GITHUB_REF_NAME:-manual}"
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            echo "release_signing=release-keystore"
          else
            echo "release_signing=debug-fallback"
          fi

      - name: Build release APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build-logs
          set -o pipefail
          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :app:assembleRelease 2>&1 | tee build-logs/assemble-release.log

      - name: Run JVM unit tests
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          set -o pipefail
          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :core:test \
            :app:testDebugUnitTest 2>&1 | tee build-logs/unit-tests.log

      - name: Prepare release assets
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-manual}"
          # workflow_dispatch without a tag falls back to a run-number name.
          if [ -z "$tag" ] || [ "$tag" = "manual" ]; then
            tag="manual-${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p artifacts
          # ABI splits produce one release APK per ABI plus a universal APK, e.g.
          # app-arm64-v8a-release.apk, app-universal-release.apk.
          shopt -s nullglob
          release_apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#release_apks[@]}" -lt 5 ]; then
            echo "Expected at least 5 release APKs, found ${#release_apks[@]}:"
            ls -lh app/build/outputs/apk/release/ || true
            exit 1
          fi
          for apk in "${release_apks[@]}"; do
            test -s "$apk"
            base="$(basename "$apk" .apk)"
            abi="${base#app-}"
            abi="${abi%-release}"
            cp "$apk" "artifacts/Jingliu-${tag}-${abi}.apk"
          done
          # Invisible one-character placeholder (U+200B zero-width space) for the
          # release notes. The notes area must stay non-empty, otherwise GitHub
          # falls back to showing the tagged commit's subject; HTML comments and
          # whitespace get rendered/trimmed visibly, a zero-width space does not.
          printf '\u200b' > release-notes.txt
          ls -lh artifacts/

      - name: Publish GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Jingliu ${{ github.ref_name }}
          generate_release_notes: false
          # Keep the notes area visually empty (see release-notes.txt above).
          body_path: release-notes.txt
          fail_on_unmatched_files: true
          files: |
            artifacts/*.apk

      - name: Upload release assets as artifact (manual runs)
        if: success() && (!startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v7
        with:
          name: Jingliu-release-${{ env.RELEASE_TAG }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Jingliu-release-reports-${{ github.run_number }}
          path: |
            build-logs/
            app/build/reports/
            app/build/test-results/
            core/build/reports/
            core/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
