name: Release Jingliu APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jingliu-release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"
  GRADLE_VERSION: "8.11.1"

jobs:
  build-and-release:
    name: Build and publish release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: true

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Configure CI build and version
        shell: bash
        env:
          QR_AUTH_BRIDGE_URL: ${{ vars.QR_AUTH_BRIDGE_URL }}
        run: |
          set -euo pipefail
          python_bin="$(python -c 'import sys; print(sys.executable)')"
          printf 'buildPython=%s\n' "$python_bin" > python-build.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [ -n "${QR_AUTH_BRIDGE_URL:-}" ]; then
            printf 'bridgeUrl=%s\n' "$QR_AUTH_BRIDGE_URL" > qr-auth.properties
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            version_name="${release_tag#v}"
          else
            release_tag="manual-${GITHUB_RUN_NUMBER}"
            version_name="0.0.0-${release_tag}"
          fi
          # The old per-ABI scheme reached versionCode 4020. Keep every new APK safely above it.
          version_code=$((1000000 + $(git rev-list --count HEAD)))

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "JINGLIU_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "JINGLIU_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Restore stable debug signing key when configured
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          fi

      - name: Restore release signing key when configured
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
            : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
            : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            chmod 600 "$RUNNER_TEMP/release.keystore"
            keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build release APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleRelease

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 5 ]; then
            echo "Expected exactly 5 APKs, found ${#apks[@]}."
            ls -lh app/build/outputs/apk/release/ || true
            exit 1
          fi

          for apk in "${apks[@]}"; do
            test -s "$apk"
            base="$(basename "$apk" .apk)"
            abi="${base#app-}"
            abi="${abi%-release}"
            cp "$apk" "artifacts/Jingliu-${RELEASE_TAG}-${abi}.apk"
          done

          {
            echo "Jingliu ${JINGLIU_VERSION_NAME}"
            echo
            echo "内部 versionCode：${JINGLIU_VERSION_CODE}"
            echo
            echo "Jingliu-${RELEASE_TAG}-arm64-v8a.apk：绝大多数安卓手机，优先下载"
            echo "Jingliu-${RELEASE_TAG}-armeabi-v7a.apk：老旧 32 位安卓手机"
            echo "Jingliu-${RELEASE_TAG}-x86_64.apk：64 位安卓模拟器"
            echo "Jingliu-${RELEASE_TAG}-x86.apk：老旧 32 位安卓模拟器"
            echo "Jingliu-${RELEASE_TAG}-universal.apk：不清楚架构时使用，文件最大"
          } > release-notes.txt
          ls -lh artifacts/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Jingliu ${{ github.ref_name }}
          generate_release_notes: false
          body_path: release-notes.txt
          fail_on_unmatched_files: true
          files: artifacts/*.apk

      - name: Upload manual release APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: Jingliu-release-${{ env.RELEASE_TAG }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
