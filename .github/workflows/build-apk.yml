name: Build Jingliu APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: jingliu-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"
  GRADLE_VERSION: "8.11.1"

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: true

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # The source archive deliberately doesn't contain gradle-wrapper.jar.
      # setup-gradle installs the exact compatible Gradle version and exposes `gradle` on PATH.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Configure local CI paths
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(python -c 'import sys; print(sys.executable)')"
          printf 'buildPython=%s\n' "$python_bin" > python-build.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f python-runtime-requirements.txt

      # Optional: create one standard Android debug keystore, encode it with Base64,
      # and save it as the repository secret DEBUG_KEYSTORE_BASE64. This keeps APK
      # signatures stable across workflow runs. Without it, the APK is still built,
      # but a fresh runner may use a different debug signature.
      - name: Restore stable debug signing key when configured
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey >/dev/null
            echo "Stable debug keystore restored."
          else
            echo "DEBUG_KEYSTORE_BASE64 is not configured; Gradle will use a temporary debug key."
          fi

      - name: Show toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          python --version
          gradle --version
          sdkmanager --list_installed | sed -n '1,120p'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          set -o pipefail
          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :app:assembleDebug 2>&1 | tee build-logs/assemble-debug.log

      # Tests are useful diagnostics, but a test regression shouldn't hide an APK
      # which has already compiled successfully. The report artifact records failures.
      - name: Run JVM unit tests
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          set -o pipefail
          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :core:test \
            :app:testDebugUnitTest 2>&1 | tee build-logs/unit-tests.log

      - name: Verify split APK outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Compile gate only: no debug APKs are published from this workflow.
          # Release APKs are produced exclusively by the Release workflow on tags.
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -lt 5 ]; then
            echo "Expected at least 5 split APKs, found ${#apks[@]}:"
            ls -lh app/build/outputs/apk/debug/ || true
            exit 1
          fi
          for apk in "${apks[@]}"; do
            test -s "$apk"
          done
          ls -lh app/build/outputs/apk/debug/

      - name: Upload build logs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Jingliu-build-reports-${{ github.run_number }}
          path: |
            build-logs/
            app/build/reports/
            app/build/test-results/
            core/build/reports/
            core/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
