name: Build Jingliu APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jingliu-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    name: Build and upload debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: true

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Configure CI build and version
        shell: bash
        env:
          QR_AUTH_BRIDGE_URL: ${{ vars.QR_AUTH_BRIDGE_URL }}
        run: |
          set -euo pipefail
          python_bin="$(python -c 'import sys; print(sys.executable)')"
          printf 'buildPython=%s\n' "$python_bin" > python-build.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          if [ -n "${QR_AUTH_BRIDGE_URL:-}" ]; then
            printf 'bridgeUrl=%s\n' "$QR_AUTH_BRIDGE_URL" > qr-auth.properties
          fi

          base_version="$(tr -d '\r\n' < VERSION)"
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo "Invalid VERSION"; exit 1; }
          # The old per-ABI scheme reached versionCode 4020. Keep every new APK safely above it.
          version_code=$((1000000 + $(git rev-list --count HEAD)))

          echo "JINGLIU_VERSION_NAME=${base_version}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "JINGLIU_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Restore stable debug signing key when configured
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          fi

      - name: Build debug APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 5 ]; then
            echo "Expected exactly 5 APKs, found ${#apks[@]}."
            ls -lh app/build/outputs/apk/debug/ || true
            exit 1
          fi

          for apk in "${apks[@]}"; do
            test -s "$apk"
            base="$(basename "$apk" .apk)"
            abi="${base#app-}"
            abi="${abi%-debug}"
            cp "$apk" "artifacts/Jingliu-dev-${GITHUB_RUN_NUMBER}-${abi}.apk"
          done
          ls -lh artifacts/

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: Jingliu-debug-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
